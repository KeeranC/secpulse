version: 2
# Monthly, one grouped pull request per ecosystem. New releases must be 7 days old before
# they are proposed: a hijacked release is usually spotted and pulled within days.
# .github/workflows/dependabot.yml tests each pull request and merges it when the tests pass.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # requirements.txt is compiled from requirements.in with hashes; Dependabot keeps both in step.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
