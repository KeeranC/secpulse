version: 2
updates:
  # Keeps the SHA-pinned actions current (Dependabot updates the hash and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Proposes updates to requirements.lock. Regenerate with hashes before merging if needed:
  #   pip-compile --generate-hashes --strip-extras -o requirements.lock requirements.in
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
