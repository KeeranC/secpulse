name: collect

# Two jobs, so that untrusted input and write access never meet:
#   collect  reads feeds from the internet with a READ-ONLY token. It holds the secrets it
#            needs (watchlist, ntfy), but cannot push to the repository or deploy the site.
#   publish  holds the write token. It runs no feed parsers and no third-party Python
#            packages: it rebuilds the site from main and accepts only JSON files from collect.
# Actions are pinned to commit SHAs (tags can be moved); Python packages to hashes.

on:
  schedule:
    - cron: "7,37 * * * *"      # every 30 minutes (GitHub may delay scheduled runs under load)
  workflow_dispatch:

permissions: {}                 # nothing by default; each job asks for what it needs

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned packages (hash-checked)
        run: pip install -q --require-hashes --no-deps -r requirements.txt

      - name: Restore state from the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
          fi

      - name: Collect, alert, build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_SUMMARY_MODEL: ${{ secrets.AI_SUMMARY_MODEL }}
          AI_BRIEF_MODEL: ${{ secrets.AI_BRIEF_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}            # optional: access token for a reserved topic
          STATE_KEY: ${{ secrets.STATE_KEY }}              # optional: separate key for the alert log
          WATCHLIST_YAML: ${{ secrets.WATCHLIST_YAML }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}          # optional, raises the NVD rate limit
          GITHUB_TOKEN: ${{ github.token }}                # read-only here: GitHub advisories rate limit
          PUBLIC_SITE: "1"                                   # keep vendor feeds (your stack) out of the site
          PORTAL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m collector.main --data data --out public

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: state
          path: data/*.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: portal-data
          path: public/data/*.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write           # push the data branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: state
          path: incoming/state
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: portal-data
          path: incoming/portal

      # Accept only the expected file names, and only if each one parses as JSON.
      - name: Check what collect handed over
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          allowed = {
              "incoming/state": {"state.json", "items.json", "cves.json", "brief.json"},
              "incoming/portal": {"stories.json", "cves.json", "brief.json", "meta.json", "majors.json", "products.json"},
          }
          for folder, names in allowed.items():
              found = {p.name for p in pathlib.Path(folder).rglob("*") if p.is_file()}
              if found - names:
                  sys.exit(f"unexpected files in {folder}: {sorted(found - names)}")
              for name in found:
                  json.loads((pathlib.Path(folder) / name).read_text(encoding="utf-8"))
          print("handover ok")
          PY

      # One orphan commit, force-pushed: main stays clean and the repo does not grow.
      - name: Save state to the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd incoming/state
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build the site from main
        run: |
          python3 collector/sitecopy.py site _site
          mkdir -p _site/data
          cp incoming/portal/*.json _site/data/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
